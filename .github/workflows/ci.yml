# Runs the project's checks on every pull request and on every push to main.
#
# The blocklist guard reads its terms from the BLOCKLIST repository secret
# (Settings → Secrets and variables → Actions) — the same terms as the local,
# git-ignored `.blocklist`. Without the secret the guard fails closed on
# purpose: a guard that silently checks nothing only looks like protection.
# Pull requests from forks receive no secrets, so they skip the guard step;
# review them by hand before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Blocklist guard
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BLOCKLIST: ${{ secrets.BLOCKLIST }}
        run: npm run guard

      - name: Build
        run: npm run build
