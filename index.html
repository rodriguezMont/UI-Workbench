<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>UI Workbench</title>
    <!-- The reviewer's stored color scheme, before the first paint, so a dark
         workbench does not flash white. Same key as src/workbench/theme.ts. -->
    <script>
      try {
        var scheme = localStorage.getItem("ui-workbench-theme");
        if (scheme === "light" || scheme === "dark") document.documentElement.dataset.theme = scheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
